<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сканер склада</title>

  <!-- PWA-манифест -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }
    #reader {
      width: 300px;
      margin: 12px auto;
      border: 2px solid #4CAF50;
      border-radius: 10px;
    }
    button {
      padding: 14px 28px;
      font-size: 18px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 12px;
      cursor: pointer;
      display: block;
      width: 100%;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }
    button:active {
      background: #388E3C;
    }
    #status {
      font-size: 16px;
      margin-top: 12px;
      color: #333;
      text-align: center;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    #manual-input {
      margin-top: 20px;
      text-align: center;
    }
    input[type="text"] {
      padding: 12px;
      font-size: 20px;
      width: 180px;
      text-align: center;
      border: 2px solid #4CAF50;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>📦 Сканер склада</h1>
  <button id="scanButton">Сканировать штрихкод</button>
  <div id="reader" style="display: none;"></div>

  <h3>📋 Список товаров</h3>
  <div id="itemList"></div>

  <div style="margin-top: 20px;">
    <button id="sendToSheets" class="send-btn">📤 Отправить в Google Таблицу</button>
    <div id="status"></div>
  </div>

  <div id="manual-input">
    <input type="text" id="barcodeInput" placeholder="1234" maxlength="4" autofocus>
    <br>
    <button onclick="checkManualBarcode()">Отправить вручную</button>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // ---------- НАСТРОЙКИ ----------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzidSqm4iVHR2eomUB9Awz5T1Y0gMT04mw1gD7szawmi2R2goQ9mQRDSiQ9XCNQQicA/exec";
    
    let scannedItems = [];
    let html5QrcodeScanner = null;

    const scanButton = document.getElementById('scanButton');
    const readerDiv = document.getElementById('reader');
    const itemListDiv = document.getElementById('itemList');
    const sendButton = document.getElementById('sendToSheets');
    const statusDiv = document.getElementById('status');

    // ---------- СКАНЕР ----------
    scanButton.addEventListener('click', function() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        scanButton.textContent = 'Сканировать штрихкод';
        html5QrcodeScanner = null;
        return;
      }

      readerDiv.style.display = 'block';
      scanButton.textContent = 'Остановить сканер';

      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        { fps: 10, qrbox: { width: 250, height: 150 } },
        false
      );
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    });

    function onScanSuccess(decodedText) {
      scannedItems.push({
        barcode: decodedText,
        time: new Date().toLocaleTimeString()
      });
      renderList();

      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        scanButton.textContent = 'Сканировать штрихкод';
        html5QrcodeScanner = null;
      }
    }

    function onScanFailure(error) {
      // Игнорируем ошибки сканирования
    }

    function renderList() {
      itemListDiv.innerHTML = '';
      scannedItems.forEach(function(item, index) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `<span>🔹 ${item.barcode}</span><span>${item.time}</span>`;
        itemListDiv.appendChild(div);
      });
    }

    // ---------- РУЧНОЙ ВВОД ----------
    window.checkManualBarcode = function() {
      const code = document.getElementById('barcodeInput').value;
      if (code.length === 0) return;
      statusDiv.textContent = '⏳ Отправка...';
      google.script.run
        .withSuccessHandler(function(message) {
          statusDiv.textContent = message;
          document.getElementById('barcodeInput').value = '';
        })
        .withFailureHandler(function(error) {
          statusDiv.textContent = '❌ Ошибка: ' + error.message;
        })
        .updateStatusByBarcode(code);
    };

    // ---------- ОТПРАВКА В GOOGLE SHEETS ----------
    sendButton.addEventListener('click', function() {
      if (scannedItems.length === 0) {
        statusDiv.textContent = '❌ Нет отсканированных товаров';
        return;
      }

      const lastItem = scannedItems[scannedItems.length - 1];
      statusDiv.textContent = '⏳ Отправка...';

      google.script.run
        .withSuccessHandler(function(message) {
          statusDiv.textContent = message;
        })
        .withFailureHandler(function(error) {
          statusDiv.textContent = '❌ Ошибка: ' + error.message;
        })
        .updateStatusByBarcode(lastItem.barcode);
    });

    // ---------- PWA: регистрация Service Worker ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('service-worker.js')
          .then(function(registration) {
            console.log('ServiceWorker зарегистрирован');
          })
          .catch(function(err) {
            console.log('ServiceWorker ошибка: ', err);
          });
      });
    }
  </script>
</body>
</html>
